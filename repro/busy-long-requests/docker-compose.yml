name: granian-busy-repro

services:
  web:
    build:
      context: .
      target: web
      # Only used with GRANIAN_FROM=source: a granian checkout to build.
      additional_contexts:
        granian: ${GRANIAN_SRC:-../..}
      args:
        GRANIAN_FROM: ${GRANIAN_FROM:-pypi}
        GRANIAN_VERSION: ${GRANIAN_VERSION:-2.8.5}
    command: granian app:app
    # Blocking pool settings match us getsentry-web default-common.
    environment:
      GRANIAN_INTERFACE: wsgi
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: 8000
      GRANIAN_WORKERS: ${WORKERS:-2}
      GRANIAN_BLOCKING_THREADS: 8
      GRANIAN_BLOCKING_THREADS_IDLE_TIMEOUT: 20
      GRANIAN_METRICS_ENABLED: 'true'
      GRANIAN_METRICS_ADDRESS: 0.0.0.0
      GRANIAN_METRICS_PORT: 9090
      GRANIAN_METRICS_SCRAPE_INTERVAL: 15
    ports:
      - ${WEB_PORT:-8000}:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 2s
      retries: 30

  loadgen:
    build:
      context: .
      target: tools
    command: python loadgen.py
    environment:
      TARGET_URL: http://web:8000
      BASELINE_RPS: ${BASELINE_RPS:-10}
      BASELINE_SECONDS: ${BASELINE_SECONDS:-0.1}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-120}
      LONG_REQUEST_SECONDS: ${LONG_REQUEST_SECONDS:-300}
      LONG_REQUESTS: ${LONG_REQUESTS:-1}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-150}
    depends_on:
      web:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
    # Start every run with an empty TSDB, so samples from a previous run
    # can't leak into this one through the 5m lookback.
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090

  report:
    build:
      context: .
      target: tools
    command: python report.py
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOADGEN_URL: http://loadgen:8001
      OUT_DIR: /out
    volumes:
      - ./out:/out
    depends_on:
      - prometheus
      - loadgen
