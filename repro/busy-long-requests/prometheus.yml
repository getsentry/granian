global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: granian
    static_configs:
      - targets: ['web:9090']
        # The KEDA query groups by pod; this stack has one.
        labels:
          pod: web-0
  - job_name: loadgen
    static_configs:
      - targets: ['loadgen:8001']
